<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLANKS | Admin</title>
<style>
:root{--cream:#f4eee5;--paper:#fffdf9;--brown:#6b5140;--ink:#342820;--muted:#8b7868;--line:#e6dbcf;--green:#54765c;--red:#a34232}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:24px 16px 50px}.brand{text-align:center;font:30px Georgia,serif;letter-spacing:8px;color:var(--brown);margin:12px 0 24px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 4px 18px #5b46300b}h1,h2{font-family:Georgia,serif;color:var(--brown);font-weight:500;margin:0 0 14px}.muted{color:var(--muted)}label{display:block;margin:12px 0 6px}input,select{width:100%;padding:13px;border:1px solid #d8cabb;border-radius:10px;background:white;color:var(--ink);font-size:16px}.btn{border:0;border-radius:10px;padding:12px 18px;background:var(--brown);color:white;font-size:15px;cursor:pointer}.btn.secondary{background:#eee5da;color:var(--brown)}.btnrow,.toolbar,.orderhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.hidden{display:none!important}.error{color:var(--red);min-height:20px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.stat{background:#f6f0e8;border-radius:12px;padding:14px}.stat b{display:block;font:26px Georgia;color:var(--brown);margin-top:5px}.filters{display:grid;grid-template-columns:1fr 190px;gap:10px;margin:14px 0}.order{background:#fffdf9;border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 5px 18px #5b46300b}.orderNo{font:700 30px Arial,sans-serif;letter-spacing:.3px;color:var(--brown)}.total{font-weight:bold;font-size:18px}.details{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.detail{background:#faf6f0;padding:10px;border-radius:9px;overflow-wrap:anywhere}.detail small{display:block;color:var(--muted);margin-bottom:4px}.items{line-height:1.8}.status{max-width:210px;padding:9px}.pill{display:inline-block;border-radius:20px;padding:7px 12px;background:#eee5da;color:var(--brown);font-size:12px;font-weight:700}.orderStatus{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}.empty{text-align:center;padding:28px;color:var(--muted)}@media(max-width:600px){.wrap{padding:14px 12px 35px}.panel{padding:16px}.stats{grid-template-columns:repeat(3,1fr)}.stat{padding:10px}.stat b{font-size:21px}.filters{grid-template-columns:1fr}.details{grid-template-columns:1fr}.order{padding:15px;margin:12px 0}.orderNo{font-size:28px}}
</style>
</head>
<body><main class="wrap"><div class="brand">BLANKS</div>
<section class="panel" id="loginPanel"><h1>Admin dashboard</h1><p class="muted">Sign in with your private owner account to view café orders.</p><form id="loginForm"><label>Email</label><input name="email" type="email" autocomplete="username" required><label>Password</label><input name="password" type="password" autocomplete="current-password" required><div style="margin-top:16px"><button class="btn" type="submit">Sign in</button></div><p class="error" id="loginError"></p></form></section>
<section class="hidden" id="dashboard"><section class="panel"><div class="btnrow"><div><h1 style="margin-bottom:4px">Orders</h1><span class="muted" id="lastUpdated">Your café at a glance</span></div><button class="btn secondary" id="signOut">Sign out</button></div><div class="stats"><div class="stat"><span class="muted">Total orders</span><b id="totalOrders">0</b></div><div class="stat"><span class="muted">New orders</span><b id="newOrders">0</b></div><div class="stat"><span class="muted">Sales total</span><b id="salesTotal">AED 0</b></div></div><div class="toolbar"><button class="btn" id="refresh">Refresh orders</button><span class="muted" id="loadMessage"></span></div><div class="filters"><input id="search" placeholder="Search order number, name, phone or plate"><select id="statusFilter"><option value="all">All statuses</option><option value="new">New</option><option value="delivered">Delivered</option></select></div><div id="orders"><div class="empty">Loading orders…</div></div></section></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://frnuodqocdktuyelsnok.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_EM9GaBlBNUnsH_KCYu1pHg_jLiv0ocW';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);let allOrders=[];
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function money(v){return 'AED '+Number(v||0).toFixed(2)}
async function loadOrders(){ $('loadMessage').textContent='Loading…'; const {data,error}=await sb.from('orders').select('id,order_number,customer_name,customer_phone,delivery_address,notes,items,total,status,created_at').order('created_at',{ascending:false});if(error){$('loadMessage').textContent='Could not load orders. Check admin access policies.';$('orders').innerHTML='<div class="empty error">'+esc(error.message)+'</div>';return;}allOrders=data||[];$('totalOrders').textContent=allOrders.length;$('newOrders').textContent=allOrders.filter(o=>o.status==='new').length;$('salesTotal').textContent=money(allOrders.filter(o=>o.status!=='cancelled').reduce((s,o)=>s+Number(o.total||0),0));$('lastUpdated').textContent='Updated '+new Date().toLocaleString();$('loadMessage').textContent='';renderOrders();}
function renderOrders(){const q=$('search').value.trim().toLowerCase(),st=$('statusFilter').value;const list=allOrders.filter(o=>(st==='all'||o.status===st)&&(!q||[o.order_number,o.customer_name,o.customer_phone,o.delivery_address].some(v=>String(v??'').toLowerCase().includes(q))));if(!list.length){$('orders').innerHTML='<div class="empty">No matching orders.</div>';return;} $('orders').innerHTML=list.map(o=>{const items=Array.isArray(o.items)?o.items.map(i=>`${esc(i.name)} × ${esc(i.quantity)}`).join('<br>'):'—';return `<article class="order"><div class="orderhead"><div><div class="muted">ORDER NUMBER</div><div class="orderNo">#${esc(o.order_number??'—')}</div><div class="muted">${new Date(o.created_at).toLocaleString()}</div></div><div class="total">${money(o.total)}</div></div><div class="details"><div class="detail"><small>Customer</small><b>${esc(o.customer_name)}</b></div><div class="detail"><small>Mobile</small>${esc(o.customer_phone)}</div><div class="detail"><small>Car plate number</small>${esc(o.delivery_address)}</div><div class="detail"><small>Order items</small><div class="items">${items}</div></div></div>${o.notes?`<p><span class="muted">Notes:</span> ${esc(o.notes)}</p>`:''}<div class="orderStatus"><label style="margin:0">Order status <select class="status" data-id="${esc(o.id)}"><option value="new" ${o.status==='new'?'selected':''}>New</option><option value="delivered" ${o.status==='delivered'?'selected':''}>Delivered</option></select></label><span class="pill">${(o.status||'new')==='delivered'?'DELIVERED':'NEW ORDER'}</span></div></article>`}).join('');document.querySelectorAll('.status').forEach(el=>el.addEventListener('change',async()=>{el.disabled=true;const {error}=await sb.from('orders').update({status:el.value}).eq('id',el.dataset.id);el.disabled=false;if(error){alert('Could not update status: '+error.message);return;}const order=allOrders.find(x=>x.id===el.dataset.id);if(order)order.status=el.value;$('newOrders').textContent=allOrders.filter(x=>x.status==='new').length;}));}
async function showSession(){const {data:{session}}=await sb.auth.getSession();$('loginPanel').classList.toggle('hidden',!!session);$('dashboard').classList.toggle('hidden',!session);if(session)await loadOrders();}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginError').textContent='';const f=new FormData(e.target);const {error}=await sb.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(error){$('loginError').textContent=error.message;return;}await showSession();});
$('signOut').onclick=async()=>{await sb.auth.signOut();allOrders=[];showSession();};$('refresh').onclick=loadOrders;$('search').addEventListener('input',renderOrders);$('statusFilter').addEventListener('change',renderOrders);showSession();
</script></body></html>
