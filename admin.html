<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BLANKS | Orders</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f0e7;color:#34271f;font:15px Arial}.wrap{max-width:950px;margin:auto;padding:24px 16px}.brand{text-align:center;font:34px Georgia;letter-spacing:7px;color:#6b5140;margin:12px}.panel{background:#fffdf8;border:1px solid #e7ded2;border-radius:14px;padding:18px;margin:16px 0}.panel h1,.panel h2{font-family:Georgia;color:#6b5140}.field{display:block;margin:12px 0}.field input{width:100%;padding:12px;border:1px solid #d8cabb;border-radius:8px;font-size:16px}.btn{padding:11px 16px;background:#6b5140;color:white;border:0;border-radius:8px;font-size:15px}.muted{color:#8b7867}.order{border-top:1px solid #e7ded2;padding:14px 0}.order select{padding:8px;border:1px solid #d8cabb;border-radius:8px;background:white}.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.hidden{display:none}.error{color:#a23b2a}</style></head><body><div class="wrap"><div class="brand">BLANKS</div><section class="panel" id="login"><h1>Orders dashboard</h1><p class="muted">Sign in with your owner account.</p><form id="loginForm"><label class="field">Email<input name="email" type="email" required autocomplete="username"></label><label class="field">Password<input name="password" type="password" required autocomplete="current-password"></label><button class="btn">Sign in</button><p id="loginMsg" class="error"></p></form></section><section class="panel hidden" id="dashboard"><div class="row"><h1>Orders</h1><button class="btn" id="logout">Sign out</button></div><button class="btn" id="refresh">Refresh orders</button><div id="orders"><p class="muted">Loading…</p></div></section></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=window.supabase.createClient('https://frnuodqocdktuyelsnok.supabase.co','sb_publishable_EM9GaBlBNUnsH_KCYu1pHg_jLiv0ocW');const $=id=>document.getElementById(id);async function load(){let {data,error}=await sb.from('orders').select('*').order('created_at',{ascending:false});if(error){$('orders').innerHTML='<p class="error">Could not load orders. Check owner access policies.</p>';return;}if(!data.length){$('orders').innerHTML='<p class="muted">No orders yet.</p>';return;}$('orders').innerHTML=data.map(o=>`<div class="order"><div class="row"><b>Order ${o.id.slice(0,8)}</b><b>AED ${Number(o.total).toFixed(2)}</b></div><p>${new Date(o.created_at).toLocaleString()}</p><p><b>${esc(o.customer_name)}</b> · ${esc(o.customer_phone)}</p><p>${esc(o.delivery_address)}</p><p>${(o.items||[]).map(i=>`${esc(i.name)} × ${i.quantity}`).join('<br>')}</p>${o.notes?`<p>Notes: ${esc(o.notes)}</p>`:''}<label>Status: <select data-id="${o.id}" class="status"><option value="new" ${o.status==='new'?'selected':''}>New</option><option value="preparing" ${o.status==='preparing'?'selected':''}>Preparing</option><option value="ready" ${o.status==='ready'?'selected':''}>Ready</option><option value="delivered" ${o.status==='delivered'?'selected':''}>Delivered</option><option value="cancelled" ${o.status==='cancelled'?'selected':''}>Cancelled</option></select></label></div>`).join('');document.querySelectorAll('.status').forEach(s=>s.addEventListener('change',async()=>{let {error}=await sb.from('orders').update({status:s.value}).eq('id',s.dataset.id);if(error)alert('Could not update status.');}));}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}async function show(){let {data:{session}}=await sb.auth.getSession();$('login').classList.toggle('hidden',!!session);$('dashboard').classList.toggle('hidden',!session);if(session)load();} $('loginForm').addEventListener('submit',async e=>{e.preventDefault();let f=new FormData(e.target);let {error}=await sb.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});$('loginMsg').textContent=error?error.message:'';if(!error)show();});$('logout').onclick=async()=>{await sb.auth.signOut();show();};$('refresh').onclick=load;show();</script></body></html>
